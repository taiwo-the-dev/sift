name: Sync ERC-8004 agents

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

jobs:
  sync:
    name: sync (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: bsc-mainnet
            network: bsc-mainnet
          - label: bsc-testnet
            network: bsc-testnet
    concurrency:
      group: sift-agent-indexer-${{ matrix.network }}
      cancel-in-progress: false
    env:
      BNB_NETWORK: ${{ matrix.network }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: npm
          node-version: 22

      - name: Use repository npm version
        run: npm install --global npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Incrementally sync confirmed ${{ matrix.label }} events
        run: npm run sync:agents
        env:
          BNB_RPC_PRIMARY: ${{ matrix.network == 'bsc-mainnet' && (secrets.BNB_MAINNET_RPC_PRIMARY || secrets.BNB_RPC_PRIMARY) || secrets.BNB_TESTNET_RPC_PRIMARY }}
          BNB_RPC_FALLBACK_1: ${{ matrix.network == 'bsc-mainnet' && (secrets.BNB_MAINNET_RPC_FALLBACK_1 || secrets.BNB_RPC_FALLBACK_1) || secrets.BNB_TESTNET_RPC_FALLBACK_1 }}
          BNB_RPC_FALLBACK_2: ${{ matrix.network == 'bsc-mainnet' && (secrets.BNB_MAINNET_RPC_FALLBACK_2 || secrets.BNB_RPC_FALLBACK_2) || secrets.BNB_TESTNET_RPC_FALLBACK_2 }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
