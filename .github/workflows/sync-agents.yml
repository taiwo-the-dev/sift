name: Sync ERC-8004 agents

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        network:
          - bsc-mainnet
          - bsc-testnet
    concurrency:
      group: sift-agent-indexer-${{ matrix.network }}
      cancel-in-progress: false
    env:
      BNB_NETWORK: ${{ matrix.network }}
      BNB_RPC_PRIMARY: ${{ matrix.network == 'bsc-mainnet' && (secrets.BNB_MAINNET_RPC_PRIMARY || secrets.BNB_RPC_PRIMARY) || (secrets.BNB_TESTNET_RPC_PRIMARY || secrets.BNB_RPC_PRIMARY) }}
      BNB_RPC_FALLBACK_1: ${{ matrix.network == 'bsc-mainnet' && (secrets.BNB_MAINNET_RPC_FALLBACK_1 || secrets.BNB_RPC_FALLBACK_1) || (secrets.BNB_TESTNET_RPC_FALLBACK_1 || secrets.BNB_RPC_FALLBACK_1) }}
      BNB_RPC_FALLBACK_2: ${{ matrix.network == 'bsc-mainnet' && (secrets.BNB_MAINNET_RPC_FALLBACK_2 || secrets.BNB_RPC_FALLBACK_2) || (secrets.BNB_TESTNET_RPC_FALLBACK_2 || secrets.BNB_RPC_FALLBACK_2) }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Incrementally sync confirmed ${{ matrix.network }} events
        run: npm run sync:agents
