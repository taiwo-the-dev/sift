name: Assess agent health and scores

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sift-agent-assessment
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEALTH_CHECK_CONCURRENCY: ${{ vars.HEALTH_CHECK_CONCURRENCY || '3' }}
      HEALTH_CHECK_INTERVAL_HOURS: ${{ vars.HEALTH_CHECK_INTERVAL_HOURS || '6' }}
      HEALTH_CHECK_LIMIT: ${{ vars.HEALTH_CHECK_LIMIT || '50' }}
      SCORE_BATCH_LIMIT: ${{ vars.SCORE_BATCH_LIMIT || '500' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SIFT_8004SCAN_API_KEY: ${{ secrets.SIFT_8004SCAN_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check bounded eligible endpoints
        run: npm run check:agents

      - name: Recalculate affected Sift Scores
        run: npm run score:agents

      - name: Refresh bounded 8004scan shortlist cross-checks
        run: npm run enrich:categories
