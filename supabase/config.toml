# Local-only Supabase configuration. Production project settings remain in Supabase.
project_id = "sift"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

# Sift does not seed invented agent or blockchain records.
[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Authentication is intentionally deferred to M8.
[auth]
enabled = false

[storage]
enabled = false
